version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fashion_store_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    environment:
      POSTGRES_DB: fashion_store
      POSTGRES_USER: fashion_user
      POSTGRES_PASSWORD: fashion_pass_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=es_CO.UTF-8 --lc-ctype=es_CO.UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_user -d fashion_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fashion_store_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-docker-dev-key"
      DB_NAME: fashion_store
      DB_USER: fashion_user
      DB_PASSWORD: fashion_pass_2024
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fashion_store_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fashionstore.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
  pgadmin_data:

networks:
  default:
    name: fashion_store_network